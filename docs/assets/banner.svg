<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">QueryMind — Your data. In plain English.</title><desc id="desc">A natural language workspace for PostgreSQL, with SQL inspection and self-correction.</desc>
  <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#bacfab" opacity=".13"/></pattern></defs>
  <rect width="1200" height="290" rx="18" fill="#1b2d24"/><rect width="1200" height="290" rx="18" fill="url(#dots)"/>
  <rect x="48" y="48" width="44" height="44" rx="12" fill="#c9ef9e"/><g fill="none" stroke="#2e4631" stroke-width="2.4" stroke-linecap="round"><path d="M70 58v24M58 70h24M61 61l18 18M61 79l18-18"/><circle cx="70" cy="70" r="6" fill="#c9ef9e"/></g>
  <g font-family="Segoe UI,Arial,sans-serif"><text x="108" y="80" fill="#eff4e9" font-size="28" font-weight="700">QueryMind<tspan fill="#c9ef9e">.</tspan></text><text x="48" y="159" fill="#f4f7ed" font-size="43" font-weight="600" letter-spacing="-1">Your data. In plain English.</text><text x="50" y="203" fill="#b4c5a7" font-size="17">Ask a question. Inspect the SQL. Explore the answer.</text><text x="50" y="252" fill="#8ca17e" font-size="11" letter-spacing="2">FASTAPI   /   LANGGRAPH   /   POSTGRESQL   /   CHROMADB</text></g>
  <g font-family="Consolas,monospace"><rect x="812" y="66" width="323" height="158" rx="12" fill="#243c2b" stroke="#4b6541"/><circle cx="834" cy="86" r="3" fill="#9abb7b"/><circle cx="847" cy="86" r="3" fill="#668259"/><circle cx="860" cy="86" r="3" fill="#4e6743"/><text x="834" y="124" fill="#a1b891" font-size="12">Which products lead in revenue?</text><path d="M834 145h273" stroke="#405a37"/><text x="834" y="173" fill="#c9ef9e" font-size="14">SELECT<tspan fill="#d8e5cf"> clarity</tspan></text><text x="834" y="197" fill="#c9ef9e" font-size="14">FROM<tspan fill="#d8e5cf"> your_data;</tspan></text></g>
