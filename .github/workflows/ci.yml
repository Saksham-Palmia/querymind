name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ""
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest tests/unit -q
        working-directory: backend
      - run: python -m compileall -q backend/app backend/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check backend/app/web/app.js
